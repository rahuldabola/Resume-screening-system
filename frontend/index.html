<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ScreenSmart ranks candidates against a job description and shows the reasoning behind every score: matched skills, missing skills, text similarity, and keyword-stuffing penalties."
    />
    <meta name="theme-color" content="#0b1020" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ScreenSmart — AI-Powered Resume Screening</title>
    <script>
      // Runs before first paint on purpose: deciding the theme in React instead
      // would render the light palette for a frame and flash white at someone
      // who chose dark.
      (function () {
        try {
          var stored = localStorage.getItem('screensmart-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          // Storage blocked. Light theme, and the toggle still works.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
