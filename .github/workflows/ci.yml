name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ml-service:
    name: ML service (pytest + evaluations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # Lint first: it is seconds rather than minutes, and it names the line.
      - name: Lint
        run: python -m ruff check .

      - run: python -m pytest tests/ -v

      # Both evaluations run on every push, so the numbers quoted in the README
      # cannot silently drift away from what the code actually produces.
      - name: Classification evaluation (right field vs wrong field)
        run: python -m evaluation.evaluate
      - name: Ranking evaluation (ordering within one field)
        run: python -m evaluation.evaluate_ranking

  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint

      # `npm run build` typechecks as its first step, but only reports the
      # first failure it hits. Running tsc on its own first means a type error
      # is reported as a type error, with every site listed.
      - name: Typecheck
        run: npx tsc -b --force

      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ml-service, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images via Docker Compose
        run: docker compose build
